apiVersion: apps/v1
kind: Deployment
metadata:
  name: guestbook-ui
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: guestbook-ui
  template:
    metadata:
      labels:
        app: guestbook-ui
    spec:
      containers:
      - name: web
        image: ghcr.io/teyuro/argocd-lab-web:14719315b3b4d384d9e7a2abb2f1d09884c3e007
        ports:
        - containerPort: 80
